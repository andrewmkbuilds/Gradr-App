name: SEO regression

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily catch of drift between routing, sitemap and rendered metadata.
    - cron: "0 6 * * *"

jobs:
  seo:
    name: Structured data, sitemap sync and rendered metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Static: JSON-LD builders validate, sitemap entries match routing.
      - name: Structured data + sitemap unit tests
        run: bunx vitest run src/test/structuredData.test.ts src/test/sitemap.test.ts

      # The committed sitemap must be exactly what the generator produces.
      - name: Sitemap is in sync with routes
        run: |
          bun run scripts/generate-sitemap.ts
          git diff --exit-code -- public/sitemap.xml

      - name: Build
        run: bun run build

      - name: Serve build
        run: |
          bunx vite preview --port 8080 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Home page SEO + Open Graph tags
        run: node scripts/check-home-seo.mjs http://localhost:8080

      - name: Rendered metadata on every public route
        run: node scripts/validate-seo-html.mjs http://localhost:8080

      - name: Indexing and structured data regression
        run: node scripts/seo-regression-check.mjs http://localhost:8080
