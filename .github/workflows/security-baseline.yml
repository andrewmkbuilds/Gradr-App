name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  baseline:
    name: Verify RLS policies, grants and SECURITY DEFINER privileges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify security baseline
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-baseline.mjs

      - name: Fail on regression of resolved security findings
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-findings-guard.mjs

      - name: Admin RPC grants (admin succeeds, non-admin and anon refused)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          USER_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          USER_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node scripts/admin-rpc-guard.mjs

      - name: Upload admin RPC guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-rpc-guard-report
          path: tests/reports/html/admin-rpc-guard.html
          if-no-files-found: ignore

      - name: Admin table RLS matrix (admin vs non-admin vs anon JWTs)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          USER_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          USER_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node scripts/admin-rls-matrix.mjs

      - name: Build app for admin route e2e
        run: bun run build

      - name: Admin routes render for an admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
        run: |
          bunx playwright install --with-deps chromium
          bun run preview --port 8080 &
          npx wait-on http://localhost:8080 -t 60000
          node scripts/admin-routes-e2e.mjs http://localhost:8080

      - name: Upload admin route screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-routes-screenshots
          path: tests/reports/screenshots/admin-routes
          if-no-files-found: ignore


      - name: RLS and policy regression tests
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bunx vitest run src/test/securityBaseline.test.ts src/test/userPreferencesAccess.test.ts


      - name: Dependency audit (version floors + high/critical advisories)
        run: node scripts/dependency-audit.mjs

      - name: Build and gate bundle filenames against stack fingerprinting
        run: |
          bun run build
          node scripts/check-bundle-fingerprint.mjs

      - name: Security headers and technology-disclosure gate (production)
        run: node scripts/check-security-headers.mjs https://gradr.me

      - name: Runtime header assertions (/auth and OAuth paths)
        env:
          RUN_HEADER_CHECKS: "1"
          SECURITY_HEADERS_TARGET: https://gradr.me
        run: bunx vitest run src/test/securityHeaders.test.ts

  oauth-flow:
    name: Daily Google OAuth flow check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify Google callback and app-domain redirect chain
        env:
          OAUTH_FLOW_TARGET: https://app.gradr.me
          GOOGLE_E2E_STORAGE_STATE: ${{ secrets.GOOGLE_E2E_STORAGE_STATE }}
        run: node scripts/test-oauth-flow.mjs
