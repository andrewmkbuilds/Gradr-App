name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  baseline:
    name: Verify RLS policies, grants and SECURITY DEFINER privileges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify security baseline
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-baseline.mjs

      - name: Fail on regression of resolved security findings
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-findings-guard.mjs

      - name: RLS and policy regression tests
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bunx vitest run src/test/securityBaseline.test.ts src/test/userPreferencesAccess.test.ts

      - name: Dependency audit (version floors + high/critical advisories)
        run: node scripts/dependency-audit.mjs

      - name: Security headers and technology-disclosure gate (production)
        run: node scripts/check-security-headers.mjs https://gradr.me

      - name: Runtime header assertions (/auth and OAuth paths)
        env:
          RUN_HEADER_CHECKS: "1"
          SECURITY_HEADERS_TARGET: https://gradr.me
        run: bunx vitest run src/test/securityHeaders.test.ts
