name: Security headers & fingerprint audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 6 * * *" # daily drift check against production
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to audit
        default: https://gradr.me
        required: false

jobs:
  audit:
    name: Verify headers and technology disclosure
    runs-on: ubuntu-latest
    env:
      GRADR_ORIGIN: ${{ github.event.inputs.origin || 'https://gradr.me' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Policy-level: the declared headers must stay well-formed and complete.
      - name: Unit tests for the security header policy
        run: bunx vitest run src/test/securityHeaders.test.ts

      # Runtime-level: the live site must return exactly those headers.
      - name: Verify live security headers
        run: bun run scripts/security-headers-check.ts "$GRADR_ORIGIN"

      # Regression guard for CWE-200: no version/powered-by disclosure anywhere.
      - name: Technology fingerprint audit
        run: node scripts/fingerprint-audit.mjs "$GRADR_ORIGIN"
