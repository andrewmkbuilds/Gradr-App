name: OAuth flow check

on:
  schedule:
    - cron: "15 5 * * *" # daily
  workflow_dispatch:

jobs:
  oauth:
    name: Headless Google sign-in + security headers on gradr.me
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Security headers on /auth and OAuth paths
        env:
          GRADR_TARGET_ORIGIN: https://gradr.me
        run: bunx playwright test tests/security-headers.spec.ts

      - name: Daily OAuth flow check (existing + new Google accounts)
        env:
          GRADR_ORIGIN: https://gradr.me
          OAUTH_EXISTING_EMAIL: ${{ secrets.OAUTH_EXISTING_EMAIL }}
          OAUTH_EXISTING_PASSWORD: ${{ secrets.OAUTH_EXISTING_PASSWORD }}
          OAUTH_NEW_EMAIL: ${{ secrets.OAUTH_NEW_EMAIL }}
          OAUTH_NEW_PASSWORD: ${{ secrets.OAUTH_NEW_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/oauth-flow-check.mjs
