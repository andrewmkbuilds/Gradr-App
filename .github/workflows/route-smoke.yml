name: Route smoke

# Catches routing regressions (deleted Landing/Home pages reappearing, broken
# redirects, blank screens, missing 404) on every PR and push.
on:
  pull_request:
  push:
    branches: [main]

# The summary step edits a comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  route-smoke:
    name: Routes and redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Static guard: no landing/home URLs in robots.txt, sitemaps or RouteSeo.
      - name: Landing/Home removal regression test
        run: bunx vitest run src/test/landingRoutesRemoved.test.ts

      # Every committed theme baseline must be approved and hash-locked in
      # tests/visual/themes/baselines.lock.json (see scripts/baseline-approve.mjs).
      - name: Theme baseline lock check
        run: bun run visual:baseline:review

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          bun run build
          bunx vite preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 2
          done

      # Signed-out redirects, 404 handling and console-error checks. The
      # signed-in half runs automatically when a preview session is available.
      - name: Route smoke test
        run: bun run smoke:routes http://127.0.0.1:8080
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}

      # Fails the build when any route emits a console error or unhandled
      # promise rejection during the production sweep.
      - name: Console error sweep
        run: bun run smoke:console http://127.0.0.1:8080
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}

      - name: Upload console sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-sweep
          path: test-results/console-sweep
          if-no-files-found: ignore

      # Lightweight, browser-free: sign in, sign out, prove the tokens are dead
      # (so a refresh cannot rehydrate the session). Skips without credentials.
      - name: Sign-out API smoke test
        run: bun run test:signout:api
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Proves the live send path never queues a marketing-shaped email during
      # normal app usage. Skips itself without test credentials.
      - name: Email marketing guard
        run: bun run test:email-guard http://127.0.0.1:8080
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}


      # Sign-in -> dashboard end to end; skips itself without test credentials.
      - name: Sign-in to dashboard e2e
        run: bun run test:e2e:signin http://127.0.0.1:8080
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Age-confirmation gate: new accounts must confirm, existing sign-ins
      # (email + every OAuth provider) must never be blocked by it.
      - name: Age gate regression e2e
        run: bun run test:e2e:age-gate http://127.0.0.1:8080
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}


      # Admin voice console: controls render and Save submits. The speech
      # provider is stubbed; skips itself without admin credentials.
      - name: Admin voice settings smoke
        run: bun run test:admin-voice http://127.0.0.1:8080
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # 404 rendering, session persistence, axe a11y, redirect headers and
      # sign-in/dashboard visual snapshots.
      - name: Route guards (404, a11y, headers, visuals)
        run: bun run test:route-guards http://127.0.0.1:8080
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}

      # Two tabs, one session: signing out in tab A must kill tab B and its
      # already-issued refresh token. Skips itself without credentials.
      - name: Multi-tab sign-out e2e
        run: bun run test:multi-tab-signout http://127.0.0.1:8080
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Theme pixel diffs. Drift over VISUAL_TOLERANCE fails the job; drift over
      # VISUAL_QUARANTINE_TOLERANCE is *quarantined* instead — the script exits 0
      # so the merge is not blocked, and the diff images go up for triage.
      - name: Theme visual diff
        id: theme-visual
        if: hashFiles('tests/visual/themes/baseline/*.png') != ''
        run: bun run test:visual:themes
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8080
          VISUAL_TOLERANCE: "0.02"
          VISUAL_QUARANTINE_TOLERANCE: "0.25"
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}

      # Always uploaded — a quarantined run is exactly the one that needs images.
      - name: Upload theme visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-diffs
          path: |
            tests/visual/themes/diff/
            tests/visual/themes/current/
            tests/visual/themes/baseline/
            tests/reports/json/visual-themes.json
          if-no-files-found: ignore

      - name: Flag quarantined visual run
        if: always() && steps.theme-visual.outputs.quarantined == 'true'
        run: |
          echo "::warning title=Visual run quarantined::Theme drift exceeded the quarantine threshold — \
          artifacts uploaded for triage, merge not blocked."


      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-guard-visuals
          path: tests/visual/route-guards/
          if-no-files-found: ignore

      - name: Upload axe accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-guard-axe-reports
          path: tests/reports/axe/
          if-no-files-found: ignore

      # Single-file HTML report: open it straight from the artifact download.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: tests/reports/html/
          if-no-files-found: ignore

      # Traces and videos are only written for contexts that failed, so this
      # artifact exists exactly when there is something to debug.
      - name: Upload Playwright traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-and-videos
          path: |
            tests/reports/traces/
            tests/reports/videos/
          retention-days: 7
          if-no-files-found: ignore

      # Upserts one comment on the PR with the suite table plus artifact links.
      - name: Post CI test summary to PR
        if: always() && github.event_name == 'pull_request'
        run: bun run ci:summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
