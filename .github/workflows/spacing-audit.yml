name: Spacing audit

# Vertical rhythm regression gate. Fails only on NEW or WORSENING whitespace
# (see docs/vertical-rhythm.md); the per-route HTML report with before/after
# diff images is uploaded either way.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spacing-audit:
    name: Vertical rhythm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (rhythm utilities)
        run: bun run lint:rhythm

      - name: Rhythm token tests
        run: bunx vitest run src/test/verticalRhythm.test.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Playwright's package registry can expect a different browser revision
      # from the one the CI CLI downloads. Resolve the actual installed binary
      # once and pass it explicitly to the spacing audit, which owns its
      # browser launch instead of going through the shared helper.
      - name: Resolve Chromium executable
        run: |
          CHROMIUM_PATH="$(node --input-type=module -e "import { findChromium } from './scripts/lib/browser.mjs'; const p = findChromium(); if (!p) process.exit(1); process.stdout.write(p)")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          echo "Using Chromium: $CHROMIUM_PATH"

      - name: Vertical spacing audit
        run: bun run audit:spacing

      - name: Upload spacing audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacing-audit
          path: test-results/spacing-audit
          if-no-files-found: warn
