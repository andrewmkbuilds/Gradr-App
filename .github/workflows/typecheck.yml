name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the build on any new type error in app or node configs.
      - name: Typecheck (app + node)
        run: bun run typecheck

      # Guards against schema/type drift: fails when a migration adds a table
      # the committed Supabase types don't know about.
      - name: Database type drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: bun run types:check

      - name: Admin schema contract tests
        run: bunx vitest run src/test/adminSchemas.test.ts

      - name: Lint
        run: bun run lint
