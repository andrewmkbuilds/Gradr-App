name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the build on any new type error in app or node configs.
      - name: Typecheck (app + node)
        run: bun run typecheck

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Edge functions are not covered by tsgo. A `ReferenceError: data is not
      # defined` once shipped in the payments webhook and broke every Paddle
      # delivery, so unresolved names are now a hard failure here.
      - name: Typecheck (edge functions)
        run: bun run typecheck:functions

      # Guards against schema/type drift: fails when a migration adds a table
      # the committed Supabase types don't know about.
      - name: Database type drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: bun run types:check

      - name: Admin schema contract tests
        run: bunx vitest run src/test/adminSchemas.test.ts

      - name: Lint
        run: bun run lint
