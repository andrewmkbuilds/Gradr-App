name: Accessibility

# Fails the pipeline on new WCAG violations in the app surface — with a hard
# gate on the rules that keep regressing: colour contrast (class-merge
# collapses), scrollable regions without keyboard access, and focus-order /
# tabindex mistakes. Reports are uploaded as artifacts on every run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    name: Axe audit (contrast, focus, scrollable regions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          bun run build
          bunx vite preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 2
          done

      # Both surfaces are audited on every run and always produce a report.
      # `--no-fail` keeps the audit itself green: the merge gate is the
      # baseline diff below, which blocks only on findings this branch adds.
      - name: App accessibility audit (app.gradr.me)
        run: bun run audit:a11y:app http://127.0.0.1:8080 --no-fail

      # Sidebar, submenu, breadcrumbs and the mobile drawer focus trap.
      - name: Navigation accessibility audit
        run: bun run test:a11y http://127.0.0.1:8080

      # The marketing site is a separate repo and deploy. Its findings are
      # recorded here so regressions are visible, and its baseline is diffed
      # the same way — a *new* marketing regression still surfaces, while the
      # known backlog does not block unrelated app PRs.
      - name: Marketing site accessibility audit (gradr.me)
        continue-on-error: true
        run: bun run audit:a11y:marketing --no-fail

      # THE GATE: serious/critical (and gated-rule) findings that are not in
      # reports/a11y/baseline/<surface>.json fail the run. Resolved findings
      # are reported and never fail. Re-record with
      # `bun run audit:a11y:baseline:update` when a finding is accepted.
      - name: Block on new serious/critical findings
        run: bun run audit:a11y:baseline

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            reports/a11y/app.gradr.me.html
            reports/a11y/app.gradr.me.json
            reports/a11y/gradr.me.html
            reports/a11y/gradr.me.json
            reports/a11y/baseline
          if-no-files-found: warn
          retention-days: 30

