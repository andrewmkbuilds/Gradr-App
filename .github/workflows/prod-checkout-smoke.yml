name: Production checkout smoke

# Proves Paddle Checkout still initializes for every paid plan on the deployed
# build. Runs on a schedule and on demand — never on PRs, because it targets
# production rather than the branch build.
#
# Checkout.open is wrapped in-page, so no real transaction is ever started.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to smoke test
        required: false
        default: https://gradr-app.lovable.app

permissions:
  contents: read

jobs:
  checkout-smoke:
    name: Pricing CTAs initialize Paddle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Pricing checkout smoke
        run: bun run test:checkout:prod "${{ github.event.inputs.base_url || 'https://gradr-app.lovable.app' }}"
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
