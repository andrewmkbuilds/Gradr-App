name: Domain health

# Verifies every Gradr hostname resolves, terminates TLS and serves its own
# surface — and that app.gradr.me never redirects to the apex.
#
# Runs on a schedule and on demand rather than on every PR: the app-surface
# check depends on hosting configuration, not on the contents of a pull request.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  domains:
    name: DNS, TLS and redirect chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hostname healthcheck (DNS + TLS + surface)
        run: node scripts/domain-healthcheck.mjs

      - name: Production app-surface smoke (fails on any cross-domain redirect)
        run: node scripts/smoke-production-app.mjs

      - name: app.gradr.me must serve 200 (never 301/302 to gradr.me)
        run: node scripts/check-app-serving.mjs

      - name: OAuth callback preflight (no redirect to gradr.me)
        run: node scripts/preflight-oauth-callback.mjs
