services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8080"
    env_file:
      - .env
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "bun install && bun run dev"
