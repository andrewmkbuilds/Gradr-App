<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>You're offline | Gradr</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f2f0ef; color: #14262c;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b1c22; color: #f2f0ef; } }
      .card { max-width: 420px; }
      img { width: 56px; height: 56px; margin-bottom: 20px; }
      h1 { font-size: 1.5rem; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: #6b7b80; line-height: 1.55; font-size: 0.95rem; }
      button {
        border: 0; border-radius: 10px; padding: 12px 22px; min-height: 44px;
        background: #245f73; color: #f2f0ef; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #1d4e5e; }
      .accent { color: #733e24; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/gradr-logo.svg" alt="Gradr" />
      <h1>You're offline</h1>
      <p>
        Gradr can't reach the network right now. Your saved work is safe —
        <span class="accent">reconnect</span> and we'll pick up where you left off.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
